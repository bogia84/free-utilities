<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Job Alert Scanner — Results</title>
<link rel="stylesheet" href="results.css">
</head>
<body>
  <header class="topbar">
    <img src="icons/icon48.png" alt="" class="logo">
    <div class="titles">
      <h1>Job Alert Scanner</h1>
      <p id="statusLine" class="muted">Loading…</p>
    </div>
    <div class="top-actions">
      <button id="scanBtn">Scan now</button>
      <button id="markReadBtn">Mark all as read</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <section class="toolbar">
    <div class="chips" id="sourceChips"></div>
    <input id="search" type="search" placeholder="Filter by title or company…">
    <select id="sortBy">
      <option value="newest">Newest posted</option>
      <option value="found">Recently found</option>
      <option value="source">Source</option>
    </select>
  </section>

  <main id="list" class="list"></main>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-top">
        <span class="badge source"></span>
        <span class="badge new">NEW</span>
        <span class="posted"></span>
      </div>
      <h3><a target="_blank" rel="noopener"></a></h3>
      <p class="company"></p>
      <p class="location"></p>
    </article>
  </template>

  <script type="module" src="results.js"></script>
</body>
</html>
