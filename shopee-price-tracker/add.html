<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Shopee Price Tracker — Add product</title>
<link rel="stylesheet" href="add.css">
</head>
<body>
  <header class="topbar">
    <a href="popup.html" class="back">← All products</a>
  </header>

  <main class="wrap">
    <h1>Adding product</h1>
    <p id="linkLine" class="link-line"></p>
    <p id="status" class="status">Opening the product page and reading its price — this can take a few seconds…</p>
    <div id="result" class="result" hidden>
      <img id="resultImage" alt="">
      <div>
        <p id="resultName" class="result-name"></p>
        <p id="resultPrice" class="result-price"></p>
        <a id="viewLink" class="view-link" href="#">View price history →</a>
      </div>
    </div>
    <div class="actions">
      <button id="retryBtn" hidden>Try again</button>
      <button id="closeBtn">Close this tab</button>
    </div>
  </main>

  <script type="module" src="add.js"></script>
</body>
</html>
