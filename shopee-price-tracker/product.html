<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Shopee Price Tracker — Product</title>
<link rel="stylesheet" href="product.css">
</head>
<body>
  <header class="topbar">
    <a href="popup.html" class="back" id="backLink">← All products</a>
  </header>

  <main id="main" class="wrap">
    <p class="muted">Loading…</p>
  </main>

  <template id="productTemplate">
    <section class="product-hdr">
      <img class="image" alt="">
      <div class="details">
        <h1 class="name"></h1>
        <a class="open-link" target="_blank" rel="noopener">Open on Shopee ↗</a>
        <div class="price-block">
          <span class="price"></span>
          <span class="before-discount"></span>
        </div>
        <p class="meta"></p>
        <div class="actions">
          <button id="checkOneBtn">Check price now</button>
        </div>
        <p id="checkMsg" class="msg"></p>
      </div>
    </section>

    <section class="chart-section">
      <h2>Price history</h2>
      <canvas id="chart" width="900" height="320"></canvas>
      <p id="noHistory" class="muted" hidden>Not enough data yet — check back after a couple of days.</p>
    </section>

    <section class="history-section">
      <h2>Log</h2>
      <table id="historyTable">
        <thead><tr><th>Date</th><th>Price</th><th>Change</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </section>
  </template>

  <script type="module" src="product.js"></script>
</body>
</html>
